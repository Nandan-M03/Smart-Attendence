const LG=`<div style="display:grid;place-items:center;min-height:100vh;padding:16px"><div class=c style="width:100%;max-width:400px;padding:26px"><h1 class=br>SMART <i>ATTENDANCE</i> AI</h1><p class=mu>Sign in to your portal. Demo IDs: admin, T001 or CS24001.</p><p><select id=r style=width:100%><option value=s>Student<option value=t>Teacher<option value=a>Administrator</select></p><p><input id=i placeholder="ID or USN" style=width:100%></p><p><input id=pw type=password placeholder=Password style=width:100%></p><p id=e style=color:var(--no)></p><button class=p style=width:100% onclick=login()>Sign in</button></div></div>`;
async function login(){const r=$('#r').value,id=$('#i').value.trim(),E=m=>$('#e').textContent=m,a=r=='a'?(id=='admin'?{on:1}:null):S.p.find(x=>x.u==id&&x.r==r);
try{const ok=a&&a.on&&(a.ph?await H(id+':'+$('#pw').value)==a.ph:await H($('#pw').value)==DEF);if(!ok)return E('Incorrect ID or password, or the account is inactive.')}catch(e){return E('Password check is unavailable in this browser.')}
U={role:r,id};view=NAV[r][0];log('Signed in');draw()}
function draw(){if(!U)return $('#root').innerHTML=LG;const f=V[U.role][view],me=P(U.id);
$('#root').innerHTML=`<header><span class="br f">SMART <i>ATTENDANCE</i> AI</span><button onclick=th()>Light or dark</button><button onclick=out()>Sign out</button></header><nav>${NAV[U.role].map(n=>`<button class="${n==view?'on':''}" onclick="go('${n}')">${n}</button>`).join('')}</nav><main><p style="margin:14px 0 0">${U.role=='a'?'':av(me)}<span class=mu>${ROLE[U.role]}. Demo data, stored in this browser only.</span></p><h1>${esc(me.n)}</h1>${f?f():'<div class=w>Access denied for your role.</div>'}</main>`;
if(U.role=='t'&&view=='Take attendance'){if(T.step==1&&!T.st)cam();else if(T.st&&$('#v'))$('#v').srcObject=T.st}}
function go(n){stopCam();if(n!=view)T={};view=n;draw()}
function out(){stopCam();log('Signed out');U=null;T={};draw()}
function th(){const d=document.documentElement,dk=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark';d.dataset.theme=dk?'light':'dark'}
function tc(id){T.cl=T.cl||{};T.cl[id]=!T.cl[id];draw()}
function mc(id){T.c=T.c==id?null:id;T.dd=null;draw()}
function addC(){const n=$('#cn').value.trim();if(!n)return $('#er').textContent='Enter a class name.';S.cls.push({id:'c'+Date.now(),n,sem:$('#cm').value||1,ay:$('#ca').value.trim()||'2026-27 - Odd',prev:0,subs:[],tt:[],stu:[]});log('Created class '+n);draw()}
function addS(id){const c=gc(id),code=$('#sk').value.trim(),n=$('#sn').value.trim();if(!code||!n)return $('#er2').textContent='Enter a code and a name.';c.subs.push({id:'s'+Date.now(),code,n:n.toUpperCase(),ty:$('#sy').value,t:$('#sh').value});log(`Added subject ${code} to ${c.n}`);draw()}
function ds(id,s){const c=gc(id);c.subs=c.subs.filter(x=>x.id!=s);c.tt=c.tt.filter(x=>x.s!=s);log('Removed a subject from '+c.n);draw()}
function addT(id){const c=gc(id),x={d:+$('#td').value,t:$('#ts').value,e:$('#te').value,s:$('#tu').value,room:$('#tr').value.trim()||'TBA'},E=m=>$('#er2').textContent=m;
if(!x.s)return E('Add a subject first.');if(!x.t||!x.e||x.t>=x.e)return E('End time must be after start time.');
const tq=c.subs.find(s=>s.id==x.s).t;
for(const c2 of S.cls)for(const y of c2.tt)if(y.d==x.d&&y.t<x.e&&x.t<y.e){if((c2.subs.find(s=>s.id==y.s)||{}).t==tq)return E('Conflict: that teacher already has a period then ('+c2.n+').');if(y.room==x.room&&x.room!='TBA')return E('Conflict: that room is in use then ('+c2.n+').')}
c.tt.push(x);log(`Added period ${DAYS[x.d]} ${x.t} to ${c.n}`);draw()}
function dt(id,i){gc(id).tt.splice(i,1);log('Removed a period');draw()}
function rs(id,u){const c=gc(id);c.stu=c.stu.filter(x=>x!=u);log(`Removed ${u} from ${c.n}`);draw()}
function as(id){const u=$('#ns').value;if(!u)return;gc(id).stu.push(u);log(`Added ${u} to ${gc(id).n}`);draw()}
function pv(id){const c=gc(id);c.prev=c.prev?0:1;log(`${c.n} moved to ${c.prev?'previous':'current'} semesters`);draw()}
function dc(id){if(T.dd!=id){T.dd=id;return draw()}const c=gc(id);S.cls=S.cls.filter(x=>x.id!=id);log('Deleted class '+c.n);T.c=null;T.dd=null;draw()}
function addP(){const n=$('#nn').value.trim(),u=$('#nu').value.trim(),pw=$('#npw').value,f=$('#np').files[0],E=m=>$('#er').textContent=m;
if(!n||!u)return E('Enter a name and an ID.');if(u=='admin'||S.p.some(x=>x.u==u))return E('That ID is already in use.');if(pw&&pw.length<6)return E('Password needs at least 6 characters.');
const fin=async d=>{const o={r:$('#pr').value,n,u,on:1,photo:d||null};if(pw)o.ph=await H(u+':'+pw);S.p.push(o);log('Added '+u);draw()};f?shrink(f,fin):fin()}
function mg(u){T.m=u;T.d=0;draw()}
function tg(u){const p=S.p.find(x=>x.u==u);p.on=p.on?0:1;log((p.on?'Activated ':'Deactivated ')+u);draw()}
function pick(u){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>f.files[0]&&shrink(f.files[0],d=>{S.p.find(x=>x.u==u).photo=d;log('Photo updated for '+u);draw()});f.click()}
async function svPw(u){const p=$('#sp').value;if(p.length<6)return $('#er2').textContent='Password needs at least 6 characters.';S.p.find(x=>x.u==u).ph=await H(u+':'+p);log('Password reset for '+u);T.m=null;draw()}
function dl(u){if(!T.d){T.d=1;return draw()}S.p=S.p.filter(x=>x.u!=u);S.cls.forEach(c=>c.stu=c.stu.filter(x=>x!=u));delete S.base[u];if(FaceEngine.connected)fetch('/api/face/'+encodeURIComponent(u),{method:'DELETE'}).catch(()=>{});log('Deleted '+u);T.m=null;T.d=0;draw()}
function enr(u){if(!FaceEngine.connected)return $('#er2').textContent='The face server is not reachable.';const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>f.files[0]&&shrink(f.files[0],async d=>{const p=S.p.find(x=>x.u==u);try{$('#er2').textContent='Enrolling';await FaceEngine.enroll(u,d);p.enrolled=1;log('Face enrolled for '+u);draw()}catch(x){$('#er2').textContent=x.message}},720);f.click()}
async function cam(){stopCam();try{T.st=await navigator.mediaDevices.getUserMedia({video:true});$('#v').srcObject=T.st;$('#cs').textContent='Camera on.'}catch(e){const c=$('#cs');if(c)c.textContent='Camera unavailable ('+e.name+').'}}
function stopCam(){if(T.st){T.st.getTracks().forEach(t=>t.stop());T.st=null}}
async function startV(){const m=mine()[+$('#pi').value],k=[m.c.id,m.s.id,D,m.x.t].join('|');if(S.ses.some(x=>x.k==k)){T.err='This class session was already submitted.';return draw()}
T={step:1,cid:m.c.id,s:m.s.id,t:m.x.t};await FaceEngine.ping();draw()}
function begin(){T.m={};T.rec={};roster().forEach(s=>T.m[s.u]='A');T.step=2;draw()}
function exc(){stopCam();log('Teacher identity exception used (no face verification)');begin()}
function mk(u,v){T.m[u]=v;draw()}
async function vt(){const v=$('#v'),c=$('#cs'),w=$('.vw'),fr=[];try{w.classList.add('on');c.textContent='Capturing. Turn your head slowly left and right.';for(let i=0;i<8;i++){fr.push(FaceEngine.frame(v));await new Promise(r=>setTimeout(r,600))}c.textContent='Verifying';const r=await FaceEngine.verifyTeacher(U.id,fr);w.classList.remove('on');if(!r.verified){log('Teacher face verification failed');return c.textContent=r.reason||'Verification failed.'}log('Teacher face verified');begin()}catch(e){w.classList.remove('on');c.textContent='Verification error: '+e.message}}
async function scan(){const c=$('#sc'),w=$('.vw');try{w.classList.add('on');c.textContent='Scanning';const r=await FaceEngine.recognize(roster().map(s=>s.u),FaceEngine.frame($('#v'),1280));r.matches.forEach(m=>{T.rec[m.id]=m.score;if(T.m[m.id]=='A')T.m[m.id]='P'});log(`Scan: ${r.faces} faces found, ${r.matches.length} recognised`);draw();$('#sc').textContent=`${r.faces} faces found, ${r.matches.length} matched.`}catch(e){w.classList.remove('on');c.textContent='Scan error: '+e.message}}
function submit(){const k=[T.cid,T.s,D,T.t].join('|');if(S.ses.some(x=>x.k==k)){T.err='This session was already submitted.';return draw()}
const r={};roster().forEach(s=>r[s.u]=T.m[s.u]||'A');stopCam();S.ses.push({k,c:T.cid,s:T.s,date:D,t:T.t,by:U.id,r});T.sum=[Object.values(r).filter(v=>v!='A').length,Object.keys(r).length];log(`Submitted attendance ${T.sum[0]}/${T.sum[1]} present`);T.step=4;draw()}
draw();
